# Configuración del análisis de SonarQube Cloud (lo usa el job "SonarQube" de la CI).
#
# Revisa que estas dos claves coincidan con las de tu proyecto en SonarQube Cloud
# (página del proyecto → Information). Si son distintas, cámbialas aquí.
sonar.organization=andressolvera
sonar.projectKey=AndressOlvera_job-tracker
sonar.projectName=Job Tracker

# Código que se analiza y sus pruebas. En el frontend, las pruebas viven junto
# al código, así que se separan por nombre.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Cobertura que generan pytest y Vitest en la CI
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Punto de arranque de React: no tiene lógica que probar
sonar.coverage.exclusions=frontend/src/main.tsx

sonar.sourceEncoding=UTF-8
