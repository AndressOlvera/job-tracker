# Servicios de Job Tracker.
#
# Toda la aplicación (http://localhost:8080):
#   docker compose up -d          -> construye las imágenes y levanta todo en segundo plano
#   docker compose ps             -> estado de los servicios (api y web deben decir "healthy")
#   docker compose logs -f api    -> sigue los logs de un servicio (Ctrl + C para salir)
#   docker compose down           -> detiene todo (los datos se conservan)
#   docker compose down -v        -> detiene todo y BORRA los datos
#
# Solo la base de datos, para desarrollar con `flask run` y `npm run dev`:
#   docker compose up -d db
#
# Más detalles en docs/06-docker.md.

name: job-tracker

# Variables que comparten la API y las migraciones. La API se conecta a la base
# por el nombre del servicio ("db"), no por localhost: cada contenedor es como
# una computadora aparte dentro de la red de Docker.
x-api-environment: &api-environment
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-jobtracker}@db:5432/${POSTGRES_DB:-jobtracker}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    ports:
      # Solo accesible desde tu computadora (127.0.0.1), no desde la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Los datos viven en un volumen de Docker y sobreviven a reinicios.
      - db-data:/var/lib/postgresql/data
      # Scripts que se ejecutan solo la PRIMERA vez que se crea el volumen.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones pendientes (`flask db upgrade`) y termina.
  # Usa la misma imagen que la API; la API no arranca hasta que esto acaba bien.
  migrate:
    image: job-tracker-api
    # La imagen la construye el servicio "api"; aquí no se descarga de internet.
    pull_policy: never
    command: ["flask", "db", "upgrade"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: job-tracker-api
    # Reconstruye la imagen en cada `docker compose up` para no correr código
    # viejo. Gracias a la caché de Docker, si nada cambió tarda unos segundos.
    pull_policy: build
    environment: *api-environment
    # Sin `ports`: la API no se expone a tu computadora. Se llega a ella a
    # través de Nginx en http://localhost:8080/api/v1/...
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: job-tracker-web
    pull_policy: build
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
